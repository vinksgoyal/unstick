<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unstick</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
  <main>
    <h1>Unstick</h1>
    <p class="intro">One small leaf. Nothing else.</p>
    <textarea id="goal" placeholder="What's the thing you keep not starting?"></textarea>
    <div class="state" aria-label="Current state"><label>Minutes <input id="minutes" type="number" value="5" min="1" max="60"></label><label>Energy <input id="energy" type="number" value="2" min="1" max="5"></label><label>Time <input id="time" type="time"></label></div>
    <button id="unstick">Show me one leaf</button>
    <section id="cards" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
