services:
  - type: web
    name: unstick-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_MODE
        value: hosted
      - key: TINKER_SAMPLER_PATH
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: unstick-web
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: unstick-api
          property: host
