services:
  - type: web
    name: unstick-api
    runtime: python
    pythonVersion: "3.12.7"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: hosted
      - key: TINKER_SAMPLER_PATH
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
